services:
  db:
    image: mysql:8.0
    # The dump uses MySQL 8 collations and 0000-00-00 dates, and the legacy
    # INSERTs rely on implicit defaults, so run without strict/zero-date modes.
    command: ["--sql-mode=", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: nounblox
      MYSQL_DATABASE: nounblox
      MYSQL_USER: nounblox
      MYSQL_PASSWORD: nounblox
    volumes:
      - dbdata:/var/lib/mysql
      - "./m34533_nounblx (1).sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"
      - "./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    command: ["php", "-S", "0.0.0.0:3000", "-t", "/var/www/html", "/var/www/html/router.php"]
    environment:
      DB_SERVER: db
      DB_USERNAME: nounblox
      DB_PASSWORD: nounblox
      DB_NAME: nounblox
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ".:/var/www/html"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:3000/Default.aspx') === false ? 1 : 0);"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: on-failure

volumes:
  dbdata:
